<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Modern minimal house with key concept -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- House structure -->
  <path d="M 60 90 L 100 50 L 140 90 L 140 150 L 60 150 Z" fill="url(#grad1)" opacity="0.9"/>
  
  <!-- Roof line highlight -->
  <path d="M 55 90 L 100 45 L 145 90" stroke="#667eea" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Door -->
  <rect x="85" y="115" width="30" height="35" fill="#ffffff" opacity="0.3" rx="2"/>
  
  <!-- Windows -->
  <rect x="70" y="100" width="15" height="15" fill="#ffffff" opacity="0.4" rx="1"/>
  <rect x="115" y="100" width="15" height="15" fill="#ffffff" opacity="0.4" rx="1"/>
  
  <!-- Key icon overlay -->
  <circle cx="145" cy="125" r="18" fill="#f59e0b" opacity="0.95"/>
  <path d="M 145 118 L 145 132 M 145 132 L 148 129 M 145 132 L 142 129" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="115" r="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
