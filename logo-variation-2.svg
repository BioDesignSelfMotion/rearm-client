  <rect x="63" y="114" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="71" y="114" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  
  <!-- Building 2 (taller) -->
  <rect x="85" y="70" width="25" height="60" fill="#ffffff" opacity="0.95" rx="2"/>
  <rect x="89" y="75" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="97" y="75" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="89" y="83" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="97" y="83" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="89" y="91" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="97" y="91" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="89" y="99" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="97" y="99" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="89" y="107" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="97" y="107" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  
  <!-- Building 3 -->
  <rect x="115" y="90" width="22" height="40" fill="#ffffff" opacity="0.9" rx="2"/>
  <rect x="119" y="95" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="127" y="95" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="119" y="103" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
  <rect x="127" y="103" width="4" height="4" fill="#06b6d4" opacity="0.6"/>
